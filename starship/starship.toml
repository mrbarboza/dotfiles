add_newline = true
command_timeout = 500
palette = "rose_pine_moon"
format = "$directory$git_branch$git_status$cmd_duration$character"

[palettes.rose_pine_moon]
muted = "#6e6a86"
love  = "#eb6f92"
gold  = "#f6c177"
pine  = "#3e8fb0"
foam  = "#9ccfd8"
iris  = "#c4a7e7"

[character]
success_symbol = "[❯](bold pine)"
error_symbol   = "[✗](bold love)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style             = "bold foam"
repo_root_style   = "bold foam"
repo_root_format  = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style  = "italic iris"

[git_status]
format     = '[$all_status]($style)'
style      = "gold"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "= "
up_to_date = ""
untracked  = "? "
modified   = "! "
stashed    = ""
staged     = "+ "
renamed    = ""
deleted    = "- "

[cmd_duration]
min_time = 2_000
format   = "took [$duration]($style) "
style    = "muted"
