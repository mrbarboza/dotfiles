name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: nix flake check + darwin build (dry)
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build darwin configuration (no activate)
        run: |
          nix build .#darwinConfigurations.neo.system \
            --print-build-logs \
            --no-link
