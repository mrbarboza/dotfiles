onboarding = false

[theme]
name       = "rose-pine"
auto_switch = true
dark_name  = "rose-pine"
light_name = "rose-pine-dawn"

[theme.custom]
panel_bg = "reset"

[keys]
focus_agent      = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
last_pane        = "prefix+a"

# lazygit in a session-modal popup
[[keys.command]]
key     = "prefix+alt+g"
type    = "popup"
command = "lazygit"
width   = "80%"
height  = "80%"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
mouse_capture                     = true
mouse_scroll_lines                = 3
accent                            = "#f6c178"
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab      = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled      = true
done_path    = "sounds/done.mp3"    # WC3 peon: "Work complete!"
request_path = "sounds/request.mp3" # WC3 peon: "Ready to work!"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

[advanced]
scrollback_limit_bytes = 10000000
