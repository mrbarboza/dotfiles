onboarding = false

[theme]
name = "solarized"
auto_switch = false
dark_name  = "solarized"
light_name = "solarized-light"

# Solarized Dark palette (https://ethanschoonover.com/solarized/) to match
# ghostty/wezterm's "iTerm2 Solarized Dark" scheme.
[theme.custom]
panel_bg    = "reset"   # keep terminal-inherited transparency/blur behind panels
surface_dim = "#002b36" # base03
surface0    = "#073642" # base02
surface1    = "#586e75" # base01
overlay0    = "#586e75" # base01
overlay1    = "#657b83" # base00
text        = "#eee8d5" # base2 (lightened)
subtext0    = "#657b83" # base00
mauve       = "#6c71c4" # violet
green       = "#859900" # green
yellow      = "#b58900" # yellow
red         = "#dc322f" # red
blue        = "#268bd2" # blue
teal        = "#2aa198" # cyan
peach       = "#cb4b16" # orange

[keys]
focus_agent      = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
last_pane        = "prefix+a"

# lazygit in a session-modal popup
[[keys.command]]
key     = "prefix+alt+g"
type    = "popup"
command = "lazygit"
width   = "80%"
height  = "80%"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
mouse_capture                     = true
mouse_scroll_lines                = 3
accent                            = "#b58900"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab      = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled      = false
done_path    = "sounds/done.mp3"    # WC3 peon: "Ready to work!"
request_path = "sounds/request.mp3" # WC3 peon: "Something need doing?"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

[advanced]
scrollback_limit_bytes = 10000000
