onboarding = false

[theme]
name = "solarized"
# herdr's [theme.custom] overrides are global - they are not scoped per
# dark_name/light_name variant - so auto_switch stays off to keep the
# Moon overrides below from leaking onto rose-pine-dawn's own palette.
auto_switch = false
dark_name  = "rose-pine"
light_name = "rose-pine-dawn"

# Rose Pine Moon palette (https://rosepinetheme.com/palette/) - herdr ships only
# base "rose-pine" and "rose-pine-dawn" built-ins, no "moon" variant, so the dark
# palette is remapped here to match ghostty/wezterm's rose-pine-moon scheme.
[theme.custom]
panel_bg    = "reset"   # keep terminal-inherited transparency/blur behind panels
surface_dim = "#232136" # base
surface0    = "#2a273f" # surface
surface1    = "#393552" # overlay
overlay0    = "#393552" # overlay
overlay1    = "#44415a" # highlight med
text        = "#e0def4" # text
subtext0    = "#6e6a86" # muted
mauve       = "#c4a7e7" # iris
green       = "#3e8fb0" # pine
yellow      = "#f6c177" # gold
red         = "#eb6f92" # love
blue        = "#908caa" # subtle - moon has no 2nd blue hue; pine (green) reused subtle for distinctness
teal        = "#9ccfd8" # foam
peach       = "#ea9a97" # rose

[keys]
focus_agent      = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"
last_pane        = "prefix+a"

# lazygit in a session-modal popup
[[keys.command]]
key     = "prefix+alt+g"
type    = "popup"
command = "lazygit"
width   = "80%"
height  = "80%"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
mouse_capture                     = true
mouse_scroll_lines                = 3
accent                            = "#f6c177"
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab      = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled      = false
done_path    = "sounds/done.mp3"    # WC3 peon: "Ready to work!"
request_path = "sounds/request.mp3" # WC3 peon: "Something need doing?"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

[advanced]
scrollback_limit_bytes = 10000000
